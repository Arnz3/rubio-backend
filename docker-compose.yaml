services:
  postgres:
    image: postgres:16
    container_name: rubio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rubio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rubio}
      POSTGRES_DB: ${POSTGRES_DB:-rubio}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rubio}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: